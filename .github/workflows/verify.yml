name: Build and verify patch
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4
      - name: Checkout pinned Morphe Gradle plugin
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches-gradle-plugin
          ref: 0a2c1971e2913a6ea5e8fd192d359765169a6a06
          path: build-logic/morphe-patches-gradle-plugin
          persist-credentials: false
      - name: Checkout pinned Morphe patcher
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patcher
          ref: 812e96eaac173cd058ba49e242325371959befae
          path: build-logic/morphe-patcher
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Android Morphe Manager source metadata
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/validate_morphe_metadata.py
      - name: Build Morphe patch and index
        run: bash ./gradlew :patches:generatePatchesList --no-daemon
      - name: Verify five-patch experimental bundle without changing published manifest
        run: |
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          from scripts.validate_morphe_bundle import validate_morphe_bundle
          version = next(line.split("=", 1)[1].strip() for line in Path("gradle.properties").read_text().splitlines() if line.strip().startswith("version ="))
          assert version == "0.2.1-dev.2", version
          bundle = Path(f"patches/build/libs/patches-{version}.mpp")
          validate_morphe_bundle(bundle)
          index = json.loads(Path("patches-list.json").read_text(encoding="utf-8"))
          assert index["version"] == version
          patches = index["patches"]
          assert len(patches) == 5
          assert {p["name"] for p in patches} == {
              "Permanently hide donation banner",
              "Enable local settings export (experimental)",
              "Enable local Pro features (experimental)",
              "Enable OAuth setup in re-signed FairEmail (experimental)",
              "Suppress automatic changelog popup",
          }
          for patch in patches:
              package, = patch["compatiblePackages"]
              assert package["packageName"] == "eu.faircode.email"
              one_version = patch["name"].startswith("Enable OAuth setup") or patch["name"] == "Suppress automatic changelog popup"
              versions = [t["version"] for t in package["targets"]]
              assert versions == (["1.2338"] if one_version else ["1.2337", "1.2338"])
              assert patch["default"] is (patch["name"] in {"Permanently hide donation banner", "Suppress automatic changelog popup"})
          print("FairEmail experimental five-patch metadata and Android MPP: PASS")
          print("MPP_SHA256", hashlib.sha256(bundle.read_bytes()).hexdigest())
          PY
      - name: Upload patch bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fairemail-patches-changelog-experimental
          path: patches/build/libs/patches-0.2.1-dev.2.mpp
