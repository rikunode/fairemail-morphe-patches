name: Build and verify patch
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4
      - name: Checkout pinned Morphe Gradle plugin
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches-gradle-plugin
          ref: 0a2c1971e2913a6ea5e8fd192d359765169a6a06
          path: build-logic/morphe-patches-gradle-plugin
          persist-credentials: false
      - name: Checkout pinned Morphe patcher
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patcher
          ref: 812e96eaac173cd058ba49e242325371959befae
          path: build-logic/morphe-patcher
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Android Morphe Manager source metadata
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/validate_morphe_metadata.py
      - name: Build Morphe patch and index
        run: bash ./gradlew :patches:generatePatchesList --no-daemon
      - name: Verify output
        run: |
          python3 scripts/validate_morphe_metadata.py
          python3 scripts/validate_morphe_bundle.py
          test -s patches/build/libs/patches-0.2.0.mpp
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("patches-list.json").read_text())
          assert metadata["version"] == "0.2.0", metadata["version"]
          assert len(metadata["patches"]) == 4
          assert {p["name"] for p in metadata["patches"]} == {
              "Permanently hide donation banner",
              "Enable local settings export (experimental)",
              "Enable local Pro features (experimental)",
              "Enable OAuth setup in re-signed FairEmail (experimental)",
          }
          for patch in metadata["patches"]:
              package, = patch["compatiblePackages"]
              assert package["packageName"] == "eu.faircode.email"
              if patch["name"].startswith("Enable OAuth setup"):
                  assert [t["version"] for t in package["targets"]] == ["1.2338"]
                  assert sorted(package["targets"][0]["versionCodes"].values()) == [2338] * 4
              else:
                  assert [t["version"] for t in package["targets"]] == ["1.2337", "1.2338"]
                  assert sorted(package["targets"][0]["versionCodes"].values()) == [2337] * 4
                  assert sorted(package["targets"][1]["versionCodes"].values()) == [2338] * 4
          print("Patch/index metadata verification: PASS")
          PY
      - name: Upload patch bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fairemail-patches-0.2.0
          path: patches/build/libs/patches-0.2.0.mpp
